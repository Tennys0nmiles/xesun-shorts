<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connected · XESUN Shorts Uploader</title>
<link rel="stylesheet" href="style.css">
<style>
  .code { font: 600 18px/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--line); border-radius: 10px; padding: 14px 16px; word-break: break-all; user-select: all; }
  button { font: inherit; margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  .err { color: #d0384a; }
</style>
</head>
<body>
<main>
  <h1 id="title">Almost done</h1>
  <p class="sub">XESUN Shorts Uploader · TikTok sign-in</p>
  <div id="ok" hidden>
    <p>Copy this code and paste it into the terminal that asked for it. It works once and expires in a few minutes.</p>
    <div class="code" id="code"></div>
    <button id="copy" type="button">Copy code</button>
  </div>
  <p id="bad" class="err" hidden></p>
  <p>This page only shows the code TikTok put in its address. It sends nothing anywhere.</p>
  <footer><a href="index.html">XESUN Shorts Uploader</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></footer>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var code = q.get("code"), err = q.get("error_description") || q.get("error");
  if (code) {
    document.getElementById("ok").hidden = false;
    document.getElementById("code").textContent = code;
    document.getElementById("copy").onclick = function () {
      var b = this;
      navigator.clipboard.writeText(code).then(function () { b.textContent = "Copied"; }, function () {
        var r = document.createRange(); r.selectNodeContents(document.getElementById("code"));
        var s = getSelection(); s.removeAllRanges(); s.addRange(r);
      });
    };
  } else {
    document.getElementById("title").textContent = "Not connected";
    var bad = document.getElementById("bad");
    bad.hidden = false;
    bad.textContent = err ? "TikTok said: " + err : "There's no code in this address. Start the sign-in again from the terminal.";
  }
</script>
</body>
</html>
